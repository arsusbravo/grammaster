# One address for everything:
#   /student/  -> the Vue app (Vite dev server with hot reload)
#   /admin     -> Filament admin (Laravel)
#   /api/      -> JSON API (Laravel)
#   /          -> redirects to /student/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/api/public;
    index index.php;
    client_max_body_size 20M;

    # Redirect with a relative Location (the container's own port 80 is not the port the browser uses).
    absolute_redirect off;

    # Docker's DNS, so a restarted node container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    location = / {
        return 302 /student/;
    }

    location = /student {
        return 301 /student/;
    }

    # The Vue app (^~ so the dotfile rule below cannot catch Vite's /.vite/ folder). The Vite dev server uses the
    # same /student/ base, so the path is passed on unchanged.
    # The Upgrade headers carry the hot-reload websocket.
    location ^~ /student/ {
        set $vite_upstream node:5174;
        proxy_pass http://$vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Everything else is Laravel (API, admin, Livewire, assets).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
