name: Deploy

# Deploys to grammas.arsus.it after every push to main (and on demand from the Actions tab).
# The only secret is DEPLOY_SSH_KEY (the private key). Everything else is public information and lives here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: grammas.arsus.it
  # SSH user of the site on the server, and the folder the repository is cloned in (the one that contains deploy.sh).
  DEPLOY_USER: root
  DEPLOY_PATH: CHANGE_ME

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::The secret DEPLOY_SSH_KEY is empty (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          if [ "$DEPLOY_USER" = "CHANGE_ME" ] || [ "$DEPLOY_PATH" = "CHANGE_ME" ]; then
            echo "::error::Fill in DEPLOY_USER and DEPLOY_PATH at the top of .github/workflows/deploy.yml."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The server's public host keys (from `ssh-keyscan grammas.arsus.it`), so we only ever talk to this server.
          cat > ~/.ssh/known_hosts <<'KEYS'
          grammas.arsus.it ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKJYw9ByJW+VUJmCgZj5k7Ed0DzGPoAtcaJ+CZVK835q
          grammas.arsus.it ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCYUmCmu/+gfTD65Q82+IZGPAQ9xs2P2srb65tkZAFwbHnMyqsfwfW/1oj68UTKlj+GISwiQohzHkazZoTU0rKs=
          grammas.arsus.it ssh-rsa 
          KEYS

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git pull --ff-only && ./deploy.sh"
