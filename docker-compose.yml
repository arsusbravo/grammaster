services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - node

  mysql:
    image: mysql:9.7
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    image: node:26-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    # No published port: the app is reached through nginx at /student/.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # dev = Vite dev server with hot reload (default); preview = the production build with the service worker
      APP_MODE: ${APP_MODE:-dev}
      HOME: /tmp
    command: >
      sh -c '[ -d node_modules ] || npm install;
      if [ "$$APP_MODE" = preview ]; then npm run build && npm run preview -- --host 0.0.0.0 --port 5174 --strictPort;
      else npm run dev -- --host 0.0.0.0 --port 5174; fi' 

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  mysql_data:
